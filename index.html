<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11172f"><title>별빛 모험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11172f;color:#f5f3ff;font-family:system-ui,sans-serif}.app{max-width:480px;margin:auto;padding:15px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900;color:#ffdc83;font-size:23px}.badge{background:#26345b;border-radius:20px;padding:7px 10px;font-size:12px}.panel{background:#1c2546;border:1px solid #3b4c7c;border-radius:16px;padding:14px;margin-top:13px}.arena{text-align:center;border-radius:13px;padding:18px 12px;background:radial-gradient(circle at 50% 40%,#61519a,#273761 60%,#1a2546);}.label{font-size:12px;color:#d5ddff}.mob{font-size:72px;margin:9px}.name{font-weight:800;font-size:18px}.bar{height:12px;background:#11172f;border-radius:9px;overflow:hidden;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#ff587e,#ffb36b);transition:width .2s}.heroFill{background:linear-gradient(90deg,#4fe0ba,#9af5d6)}.hp{font-size:12px;color:#dce4ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#121a34;border-radius:10px;text-align:center;padding:9px;font-size:12px;color:#cbd7ff}.stat b{display:block;color:white;font-size:19px}.hero{display:flex;align-items:center;gap:12px}.face{font-size:42px}.grow{flex:1}.heroName{font-weight:800}.sub{font-size:12px;color:#c4d1f1}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{border:0;border-radius:12px;padding:14px 7px;font-size:15px;font-weight:800;background:linear-gradient(#ffe9a9,#ffc95d);color:#1a1a2c;box-shadow:0 3px 0 #a96f32}button.blue{background:linear-gradient(#c0f5ff,#75d3ec);box-shadow:0 3px 0 #347d9b}button.purple{background:linear-gradient(#e5c6ff,#b88cff);box-shadow:0 3px 0 #7650a8}button:disabled{opacity:.4}button:active{transform:translateY(2px);box-shadow:none}.message{text-align:center;min-height:24px;color:#ffdf87;font-size:13px;font-weight:700;margin-top:9px}.log{font-size:12px;color:#cbd7ff;min-height:20px}.foot{text-align:center;color:#8595c1;font-size:10px;margin:16px}
</style></head><body><main class="app"><div class="head"><div class="title">✦ 별빛 모험</div><div class="badge">오프라인 · 1인용</div></div>
<div class="stats"><div class="stat">레벨<b id="level">1</b></div><div class="stat">골드<b id="gold">0</b></div><div class="stat">처치 수<b id="kills">0</b></div></div>
<section class="panel"><div class="arena"><div class="label" id="area">달빛 숲 · 1구역</div><div class="mob" id="mob">👹</div><div class="name" id="mobName">숲의 고블린</div><div class="bar"><div class="fill" id="mobBar" style="width:100%"></div></div><div class="hp" id="mobHp">적 HP 40 / 40</div><div class="message" id="message">공격 버튼을 눌러 전투 시작!</div></div>
<div class="buttons"><button id="attack">⚔️ 공격하기</button><button id="skill" class="blue">✨ 필살기</button><button id="heal" class="purple">💖 체력 회복</button><button id="next">➡️ 다음 적</button></div></section>
<section class="panel"><div class="hero"><div class="face">🧙</div><div class="grow"><div class="heroName">나의 영웅</div><div class="sub" id="heroStats">공격력 12 · 레벨 1</div><div class="bar"><div class="fill heroFill" id="heroBar" style="width:100%"></div></div><div class="hp" id="heroHp">HP 100 / 100</div></div></div><div class="buttons"><button class="blue" id="upgrade">⬆️ 강화 (골드 30)</button><button class="purple" id="rest">🍀 완전 회복</button></div></section>
<section class="panel"><div class="name" style="font-size:14px">📜 전투 기록</div><div class="log" id="log">혼자서 몬스터를 물리치고 강해지세요.</div></section><div class="foot">별빛 모험 · 혼자 즐기는 간단한 판타지 RPG</div></main>
<script>
let level=1,gold=0,kills=0,atk=12,maxHp=100,hp=100,stage=1,enemy={},busy=false,dead=false,skillReady=true;
const mobs=[["숲의 고블린","👹",40,5],["수정 늑대","🐺",65,8],["해골 병사","💀",90,10],["어둠의 기사","🗡️",130,13],["밤의 드래곤","🐉",200,17]];
const $=id=>document.getElementById(id);
function spawn(){let m=mobs[(stage-1)%mobs.length];let scale=Math.floor((stage-1)/5);enemy={name:m[0],emoji:m[1],max:m[2]+scale*55,hp:m[2]+scale*55,atk:m[3]+scale*3};busy=false;dead=false;skillReady=true;$("message").textContent="공격 버튼을 눌러 전투 시작!";render();}
function log(s){$("log").textContent=s;}
function render(){$("level").textContent=level;$("gold").textContent=gold;$("kills").textContent=kills;$("area").textContent=(["달빛 숲","수정 협곡","잊힌 성채","별의 제단"][Math.floor((stage-1)/3)%4])+" · "+stage+"구역";$("mob").textContent=enemy.emoji;$("mobName").textContent=enemy.name;$("mobHp").textContent=`적 HP ${Math.max(0,enemy.hp)} / ${enemy.max}`;$("mobBar").style.width=Math.max(0,enemy.hp/enemy.max*100)+"%";$("heroStats").textContent=`공격력 ${atk} · 레벨 ${level}`;$("heroHp").textContent=`HP ${hp} / ${maxHp}`;$("heroBar").style.width=Math.max(0,hp/maxHp*100)+"%";$("attack").disabled=busy||dead;$("skill").disabled=busy||dead||!skillReady;$("heal").disabled=busy||dead||hp===maxHp;$("upgrade").disabled=gold<30;}
function enemyAttack(){if(enemy.hp<=0||dead)return;let d=Math.max(1,enemy.atk-Math.floor(Math.random()*3));hp=Math.max(0,hp-d);log(`${enemy.name}의 반격! HP ${d} 감소`);if(hp<=0){dead=true;$("message").textContent="쓰러졌어요. 완전 회복을 눌러 다시 도전!";}busy=false;render();}
function hit(mult=1){if(busy||dead||enemy.hp<=0)return;busy=true;let d=Math.floor(atk*mult*(.85+Math.random()*.3));enemy.hp=Math.max(0,enemy.hp-d);if(mult>1){skillReady=false;$("message").textContent="별빛 필살기! "+d+" 피해";}else{$("message").textContent="공격 성공! "+d+" 피해";}log(`${enemy.name}에게 ${d} 피해를 줬어요.`);if(enemy.hp<=0){kills++;let reward=10+stage*3;gold+=reward;level=Math.floor(kills/3)+1;atk=12+(level-1)*3;maxHp=100+(level-1)*15;hp=Math.min(maxHp,hp+15);$("message").textContent=`승리! 골드 ${reward} 획득`;log(`승리! 골드 ${reward} 획득. 다음 적 버튼을 누르세요.`);busy=false;render();return;}render();setTimeout(enemyAttack,350);}
$("attack").onclick=()=>hit(1);$("skill").onclick=()=>hit(2.5);$("heal").onclick=()=>{if(busy||dead)return;hp=Math.min(maxHp,hp+35);$("message").textContent="체력을 35 회복했어요.";log("체력을 회복했습니다.");render();};$("next").onclick=()=>{if(enemy.hp>0&&hp>0){$("message").textContent="먼저 현재 적을 물리치세요!";return;}stage++;spawn();};$("upgrade").onclick=()=>{if(gold<30)return;gold-=30;atk+=5;maxHp+=10;hp=Math.min(maxHp,hp+10);$("message").textContent="강화 성공! 공격력 +5, 최대 HP +10";log("영웅을 강화했습니다.");render();};$("rest").onclick=()=>{hp=maxHp;dead=false;busy=false;$("message").textContent="체력이 완전히 회복됐어요.";log("휴식 완료. 다시 전투할 수 있습니다.");render();};spawn();
</script></body></html>
